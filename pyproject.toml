[project]
name = "sello"
version = "0.0.1"
description = "Un lenguaje de programación cuyo usuario es la IA: almacén de funciones con certificados"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sello"]

[tool.pytest.ini_options]
testpaths = ["tests"]
